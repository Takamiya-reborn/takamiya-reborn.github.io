name: Update data

# 每天拉取 Steam / GitHub 数据写入 app/config/generated/*.json（构建时静态注入，运行时零请求）；
# 注意 GITHUB_TOKEN 的 push 不会触发 deploy.yml，末尾需显式触发重新部署
on:
  schedule:
    # 一天 3 次（UTC 16:37/00:37/10:37 = 北京 0:37/8:37/18:37），
    # GitHub schedule 高峰期可能延迟数小时甚至跳过，多次触发缩小最坏间隔
    - cron: "37 16 * * *"
    - cron: "37 0 * * *"
    - cron: "37 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fetch Steam data
        run: node scripts/fetch-steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      # 公开资料无需鉴权
      - name: Fetch LeetCode data
        run: node scripts/fetch-leetcode.mjs

      # 内置 GITHUB_TOKEN 即可读取公开贡献数据，无需额外 Secret
      - name: Fetch GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 预生成仓库列表，构建时静态注入首屏，避免访客直连 api.github.com
      - name: Fetch repo list
        run: node scripts/fetch-repos.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/config/generated/steam.json app/config/generated/leetcode.json app/config/generated/github.json app/config/generated/repos.json public/avatar.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh site data"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git pull --rebase origin main
          git push

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        # Pages 提供的是构建时快照，新数据文件必须重新部署才会生效；
        # 数据没变时跳过，避免一天多次刷新带来的无效部署
        run: gh workflow run "Deploy" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
